name: Refresh POC dashboard

on:
  schedule:
    # Daily at 11:00 UTC (08:00 America/Sao_Paulo). Full-history rebuild each run --
    # the source API currently holds a few hundred records total, so this is cheap.
    # Tighten the cadence (e.g. every few hours) if the source updates faster than daily.
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GASBRAZIL_POC_KEY_SET: ${{ secrets.GASBRAZIL_POC_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch + build data
        run: python poc_pipeline.py all

      - name: Build dashboard
        run: python dashboard.py docs/index.html

      - name: Commit refreshed data + dashboard
        run: |
          git config user.name "poc-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/poc_results.parquet docs/index.html
          git diff --quiet --cached || git commit -m "Automated refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      # Fallback mirror: publishes the same built page to gasbrazil/poc on the
      # gasbrazil GitHub Pages account, reachable at gasbrazil.github.io/poc
      # with no custom domain of its own -- part of consolidating the gas
      # dashboards under one firewall-friendly gasbrazil.github.io hub
      # (see gasbrazil/gasbrazil.github.io and gasbrazil/ons). Same pattern
      # as the ons-dashboard mirror: uses a deploy key scoped to only the
      # gasbrazil/poc repo, skipped entirely if the secret isn't set, and
      # never fails the job.
      - name: Load gasbrazil/poc mirror deploy key
        if: ${{ env.GASBRAZIL_POC_KEY_SET == 'true' }}
        continue-on-error: true
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GASBRAZIL_POC_DEPLOY_KEY }}

      - name: Publish to gasbrazil/poc
        if: ${{ env.GASBRAZIL_POC_KEY_SET == 'true' }}
        continue-on-error: true
        run: |
          git clone git@github.com:gasbrazil/poc.git gasbrazil-poc
          cp docs/index.html gasbrazil-poc/index.html
          cd gasbrazil-poc
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
